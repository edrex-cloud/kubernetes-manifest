version: '3.8'

services:
  frontend:
    image: 591402270399.dkr.ecr.us-east-1.amazonaws.com/frontend-netflix-image:3
    ports:
      - "3000:3000"
    networks:
      - dev-net
    mem_limit: 512m
    cpus: 0.5

  backend:
    image: 591402270399.dkr.ecr.us-east-1.amazonaws.com/netflix-backend-image:11
    ports:
      - "8080:8080"
    networks:
      - dev-net
    environment:
      - MONGO_CLUSTER=
      - MONGO_DATABASE=
      - MONGO_USER=
      - MONGO_PASSWORD=

networks:
  dev-net:
    driver: bridge
